user  nginx;
worker_processes  auto;

events {
  worker_connections  1024;
}

http {
  # Optional: Rate Limiting
  limit_req_zone $binary_remote_addr zone=mylimit:10m rate=550r/s;  # Uma requisição por segundo

  # Redirecionamento permanente de www.gupo.codes para gupo.codes
  server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name pousadinha.duckdns.org;
    ssl_certificate /etc/nginx/certs/fullchain1.pem;
    ssl_certificate_key /etc/nginx/certs/privkey1.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers "EECDH+AESGCM:EDH+AESGCM:AES256+EECDH:AES256+EDH";
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    proxy_buffers 16 4k;
    proxy_buffer_size 2k;

    # Optional: Rate Limiting
    limit_req zone=mylimit burst=200 nodelay;  # Permite um burst de até 200 requisições
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    location / {
      proxy_pass http://frontend:3000/;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
}
